services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_company_os}
      POSTGRES_USER: ${POSTGRES_USER:-ai_company}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_company_dev_password}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    env_file: .env
    environment:
      PYTHONPATH: /app:/workspace
    ports: ["${BACKEND_PORT:-8000}:8000"]
    volumes:
      - ./backend:/app
      - ./agents:/workspace/agents
      - ./orchestrator:/workspace/orchestrator
      - ./deployment:/workspace/deployment
      - ./memory:/workspace/memory
      - ./database:/database
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_COMPANY_WS_URL: ${NEXT_PUBLIC_COMPANY_WS_URL:-ws://localhost:8000/ws/company}
      NEXT_PUBLIC_FOUNDER_ID: ${NEXT_PUBLIC_FOUNDER_ID:-}
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]
volumes:
  postgres_data:
  frontend_node_modules:
